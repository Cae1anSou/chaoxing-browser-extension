name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# 新提交取代同一分支或 PR 的旧检查，避免重复占用运行资源。
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Syntax and tests (Node.js 24)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Check JavaScript syntax
        run: |
          for file in extension/*.js tests/*.js tests/*.cjs; do
            node --check "$file"
          done

      - name: Run unit tests
        run: node --test tests/*.test.cjs
